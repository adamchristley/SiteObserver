name: Publish construction education demo image
on:
  push:
    branches: [main]
    paths:
      - "construction-edu-flask/**"
      - "prompt-web/**"
      - ".github/workflows/publish-construction-edu.yml"
  pull_request:
    branches: [main]
    paths:
      - "construction-edu-flask/**"
      - "prompt-web/**"
      - ".github/workflows/publish-construction-edu.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: crs_test
          POSTGRES_PASSWORD: test_only_ci
          POSTGRES_DB: crs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crs_test -d crs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CRS_TEST_POSTGRES_URL: postgresql://crs_test:test_only_ci@127.0.0.1:5432/crs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify SQLite, Flask and PostgreSQL CRS-RAG endpoints
        run: |
          python -m pip install Flask==3.1.1 pytest 'psycopg[binary]>=3.2,<4'
          python -m pytest -q construction-edu-flask/test_app.py construction-edu-flask/test_crs.py construction-edu-flask/test_postgres.py construction-edu-flask/test_nl_pipeline.py construction-edu-flask/test_osha_retrieval.py construction-edu-flask/test_layer5_hazards.py
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish sanitized research image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./construction-edu-flask/Dockerfile
          push: true
          tags: |
            ghcr.io/adamchristley/construction-edu-demo:latest
            ghcr.io/adamchristley/construction-edu-demo:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Flask research prototype with API-key-gated dependency tracking
